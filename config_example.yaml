# Vilex pipeline configuration — EXAMPLE.
#
# Copy to `config.yaml` before running (config.yaml is gitignored so your local
# models/paths/secrets-free settings don't get committed):
#
#     cp config_example.yaml config.yaml
#
# Single source of truth for every tunable parameter across Stages 1-5.
# Precedence: env override (VILEX_*) > config.yaml > in-code defaults.
# Secrets (GEMINI_CREDENTIALS / GEMINI_API_KEY / OPENAI_API_KEY) stay in the
# environment and are intentionally NOT stored here.

# ---------------------------------------------------------------- run / paths
run:
  seed: 42
  datasets: [interviewer, multiwoz, negotiator, socraticlm, persuader]
  splits: [train, test]
  target_language: vi
  dry_run: false
  test_parse: false

paths:
  results_root: data/results_vi          # Stage 1 output
  results_xt_root: data/results_vi_xt    # Stage 1.5 output
  results_dis_root: data/results_vi_dis  # Stage 1.75 output
  synthesis_root: data/vi_tt             # Stage 4 output
  bc_root: data/vi_tt_bc                 # Stage 4b output
  stage5_work_root: data/vi_stage5_work  # Stage 5.1a–5.2b intermediates
  audio_root: data/vi_audio              # Stage 5 output
  # Stage 1 source: "auto" uses the raw corpora / HF Hub; "parsed_source" reads
  # the offline per-dialogue dump at <parsed_source_root>/<dataset>/<split>/*.json
  # for every dataset (no HF, no data_root, no input_paths).
  source: auto                           # auto | parsed_source
  parsed_source_root: data/parsed_source
  data_root: data/raw                    # multiwoz / negotiator / socraticlm
  input_path: ""                         # global fallback for single-file corpora
  # Per-dataset single-file paths. Priority: input_paths[dataset] > input_path
  # > data_root. Examples:
  #   Run all 5 at once -- leave input_path empty and point persuader here (it
  #   has no data_root entry); socraticlm resolves under data_root:
  #     input_paths:
  #       persuader: /abs/path/DailyPersuasion_full_version.json
  #   Only persuader: set input_paths.persuader (or input_path) to its file.
  #   Only socraticlm: use data_root, or input_paths.socraticlm: /abs/...json.
  input_paths:
    persuader: ""
    socraticlm: ""
  voice_clone_pool: voice_clone          # Stage 5 reference wavs + .txt sidecars

# ---------------------------------------------------------------- llm routing
# Point every role at one served model with just base_url + api_key + model.
# Role-specific keys override `model`; leave them empty to inherit it.
# The backend is chosen by the model NAME: `gemini-*` -> Google, `gpt-*`/`o1..o4`
# -> api.openai.com, anything else -> base_url (OpenAI-compatible, e.g. vLLM).
llm:
  model: gemini-3.6-flash                # shared default for all four roles
  writer_model: ""                       # "" -> inherit llm.model
  boundary_model: ""
  tt_model: ""
  bc_model: ""
  base_url: http://localhost:8000/v1     # self-hosted (Qwen/...); e.g. http://host/v1
  bc_base_url: ""                        # "" -> inherit base_url
  api_key: EMPTY                         # sent as Authorization: Bearer
  anthropic_mode: false                  # true -> AnthropicClient (key from ANTHROPIC_API_KEY)
  boundary_api_key: ""                   # "" -> inherit api_key
  boundary_base_url: ""                  # "" -> inherit base_url
  temperature: 0.7
  gemini_min_interval: 2.0               # seconds between Gemini calls; env GEMINI_MIN_INTERVAL overrides
  gemini_location: global                # Vertex AI region; env GEMINI_LOCATION overrides

# ---------------------------------------------------------------- Stage 1
stage1_speechify:
  max_train_samples: 25
  max_test_samples: 25
  max_variants: 1
  interviewer_subset: workforce
  temperature: 0.7
  concise: false
  max_workers: 4

# ---------------------------------------------------------------- Stage 1.5
stage1_5_cross_turn:
  perror: 0.20
  seed: 42
  roles: both          # user | assistant | both
  min_digits: 6
  min_code_len: 5
  max_workers: 4

# ---------------------------------------------------------------- Stage 1.75
stage1_75_disfluency:
  seed: 42
  max_workers: 4
  scales:
    user: 0.4
    assistant: 0.25
  shriberg_b: 0.9453
  types: [fp, dm, edit, rep]
  rep_span: [1, 1, 2]
  inventories:
    fp:
      vi: ["ừm", "à", "ờ", "ừ", "hừm", "ơ", "ưm"]
      en: ["um", "uh", "er", "hmm", "ah"]
    dm:
      vi: ["à mà", "thì", "mà"]
      en: ["like", "you know", "well", "so", "I mean", "actually"]
    edit:
      vi: ["ý tôi là", "tức là", "hay là", "không phải", "à mà"]
      en: ["I mean", "that is", "or rather", "no wait", "wait"]

# ---------------------------------------------------------------- Stage 4
stage4_synthesis:
  max_turns: 0        # 0 = auto = len(source_turns)
  max_dialogues: 15
  max_workers: 1
  temperature_user: 0.2
  temperature_ai: 0.2
  guards:
    length_guard_start: 0
    interruption_guard_start: 3
    length_guard_gap: 4
  ft_terminal_punct: [".", "?", "!"]
  hesitations:               # words that count as a candidate boundary in Stage 4 slot detection
    - um
    - uh
    - umm
    - uhh
    - hm
    - hmm
    - huh
    - ưm
    - à
    - ừ
    - ơ
    - ơi
    - hử
    - chà
    - á
    - ú
  judge:
    stop_check_every: 0      # 0 disables the judge early-stop; N>0 checks every N turns (extra LLM calls)
    min_turns_before_stop: 2
  hf_model_name_or_path: ""  # optional Stage 3 LoRA adapter dir (wins over llm.tt_model)
  hf:
    max_seq_length: 1024
    use_last_n_history: 4
    batch_size: 8
    load_in_4bit: false

# ---------------------------------------------------------------- Stage 4b
stage4b_backchannel:
  prompt_kind: qwen        # qwen | legacy
  max_workers: 4
  max_tokens: 32
  temperature: 0.7
  max_retries: 2
  valid_max_words: 3
  max_file_attempts: 3
  fallback:
    vi: ["ừ", "à", "vâng", "phải", "ồ"]
    en: ["mhm", "yeah", "right", "okay", "oh"]

# ------------------------------------------------------------- Stage 5 (shared)
# One block per Stage 5 sub-stage:
#   stage5            shared: mode/seed/language/tags/backchannels/voice
#   stage5_1a_prep    5.1a  CPU  text prep   (tts_render/stage5a_prep.py)
#   stage5_1b_render  5.1b  GPU  OmniVoice   (stage5b_render.py)
#   stage5_2a_align   5.2a  GPU  VAD + Qwen3 (stage5c_align.py)
#   stage5_2b_assemble 5.2b CPU  placement/timing/LUFS (stage5d_assemble.py)
# The monolithic convert_spoken.py reads the same tree via monolithic_view().
stage5:
  mode: split                  # split | monolithic
  num_variants: 1
  max_dialogues: 0             # 0 = all
  seed: null                   # null -> run.seed
  language: null               # null -> run.target_language (vi)
  target_sr: 24000
  prompt_sr: 16000
  tags:
    render: false              # keep supported tags for the TTS to voice
    supported:
      - "[laughter]"
      - "[sigh]"
      - "[confirmation-en]"
      - "[question-en]"
      - "[question-ah]"
      - "[question-oh]"
      - "[question-ei]"
      - "[question-yi]"
      - "[surprise-ah]"
      - "[surprise-oh]"
      - "[surprise-wa]"
      - "[surprise-yo]"
      - "[dissatisfaction-hnn]"
  backchannels:
    candidates:
      en: ["yeah", "uh-huh", "mm-hmm", "right", "okay"]
      vi: ["ưm", "à", "ừ", "vâng", "phải", "ồ", "mm-hm", "uh huh", "ok",
           "ừ [confirmation-en]", "ồ [surprise-oh]", "[laughter]", "[sigh]"]
    rising_tokens: ["yeah", "ưm", "vâng", "à", "ừ"]
  voice:
    user_instruct: "male, northern accent"
    assistant_instruct: "female, gentle"

# ------------------------------------------------------------- Stage 5.1a prep
stage5_1a_prep:
  work_root: null              # null -> paths.stage5_work_root

# ----------------------------------------------------------- Stage 5.1b render
stage5_1b_render:
  backend: omnivoice           # omnivoice (VI); Chatterbox/EN is monolithic-only
  device: cpu                 # cuda | cpu
  speed: 1.2
  language: null               # null -> stage5.language
  omnivoice:
    batch_size: 8
    max_unit_chars: 400        # a longer unit is generated on its own
    max_retries: 2
    fallback_action: silence   # silence (0.2s) after retries are exhausted

# ------------------------------------------------------------ Stage 5.2a align
stage5_2a_align:
  device: cuda                 # Qwen3 aligner device (Silero VAD always runs on CPU)
  language: null               # null -> stage5.language
  vad_threshold: 0.3           # Silero VAD speech probability (CPU, tiny model)
  max_prompt_secs: 10          # reference clip clamp
  aligner:
    model: Qwen/Qwen3-ForcedAligner-0.6B-hf
    dtype: auto                # auto (bf16 on Ampere+, fp16 else) | bfloat16 | float16 | float32
    granularity: utterance     # utterance (whole turn) | sentence (per generated unit)
    max_secs: 240              # skip the model above this length -> fallback
    fallback: proportional     # drop | proportional
    batch: false               # batch the aligner forward (implies bc_placement: defer)
    batch_size: 8

# --------------------------------------------------------- Stage 5.2b assemble
stage5_2b_assemble:
  profile: false               # log per-dialogue generate/align timings
  bc_placement: auto           # auto | inline | defer (auto -> defer if aligner.batch)
  cleanup_intermediate: true   # delete raw/trimmed unit wavs after 5.2b
  timing:
    gap:
      exp_scale: 0.7067
      min_sec: 0.003
      max_sec: 2.50
    pause:
      exp_scale: 0.6780
      min_sec: 0.001
      max_sec: 4.00
    intra_pause:
      exp_scale: 0.30
      min_sec: 0.10
      max_sec: 1.00
    user_interrupt_overlap_sec: 0.64
    user_interrupt_prob: 0.5
  audio:
    target_lufs: -23.0
    noise_floor_amp: 0.000
    backchannel_attenuation: 0.8
    # Write per-variant word-level forced-alignment JSON (alignment_user.json /
    # alignment_assistant.json); also part of the resume/skip check when on.
    save_align_json: false
