[project]
name = "vilex"
version = "0.1.0"
description = "Vilex: Vietnamese turn-taking dialogue synthesis (adapted from DuplexGen, EMNLP 2026)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Vilex Authors", email = "vilex@example.com"}]
keywords = ["dialogue", "turn-taking", "tts", "vietnamese", "duplex"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "openai>=1.50",
  "pydantic>=2.5",
  "tqdm>=4.65",
  "numpy>=1.24,<3",
  "datasets>=2.19,<6",
  "torch>=2.6,<3",
  "transformers>=4.53,<5",
  "peft>=0.10",
  "accelerate>=0.30",
  "bitsandbytes>=0.43",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "tensorboard>=2.15",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "pillow>=10.0",
]

[project.optional-dependencies]
# Tooling for working on Vilex itself — not needed to run the pipeline.
# These are exactly the three checks CI gates on (see .github/workflows/ci.yml).
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "black>=24.3",
]

[project.urls]
Homepage = "https://github.com/vilex/vilex"
Repository = "https://github.com/vilex/vilex"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.black]
line-length = 100
exclude = "vilex/tts/chatterbox"

[tool.ruff]
line-length = 100
exclude = ["vilex/tts/chatterbox"]

[tool.pytest.ini_options]
testpaths = ["tools"]
